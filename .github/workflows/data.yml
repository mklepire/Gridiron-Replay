name: Refresh data
# Rebuilds players, schedule and weekly stat styles. Runs daily (and Tuesday morning after stat corrections),
# then commits the files so Vercel redeploys.
on:
  schedule:
    - cron: '17 11 * * *'   # daily ~4am PT
    - cron: '17 15 * * 2'   # Tuesday ~8am PT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "pixel-bowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
